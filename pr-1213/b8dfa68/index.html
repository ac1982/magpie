<main><h1>#1213 界面预览</h1><p class="m">commit b8dfa68 · <a href="https://github.com/yetone/magpie/pull/1213">回到 PR</a> · app.js 现在把「按在页面滚动条上（pointerdown 落在 .view 的滚动条带内）到松手」这段期间的 scroll 当作读者发起的：拖动不再被 backToReader 逐帧拉回，同时放开点击后的 held 保持与 pinSizes 的锚定回拉；routing.js 的 steady() 通过 window.readerScrolling() 在读者正在滚动时不再把 scrollTop 写回。用户可见的结果是用鼠标拖动页面右侧滚动条（以及先点页面再拖）能让页面停在拖到的位置。</p>
